<!-- src/app/shared/components/confirm-dialog/confirm-dialog.component.html -->
<div 
  *ngIf="visible || overlayState === 'visible'"
  class="dialog-overlay"
  [@overlayAnimation]="overlayState"
  (click)="onOverlayClick()"
  (keydown)="onKeyDown($event)"
  tabindex="-1">

  <!-- Contenedor del diálogo -->
  <div 
    [class]="dialogClasses"
    [style.width]="dialogWidth"
    [@dialogAnimation]="animationState"
    (click)="$event.stopPropagation()">

    <!-- Header del diálogo -->
    <div class="dialog-header">
      
      <!-- Icono -->
      <div *ngIf="config.showIcon" class="dialog-icon-container">
        <div 
          class="dialog-icon"
          [style.background-color]="iconConfig.bgColor"
          [style.color]="iconConfig.color">
          <i [class]="'pi ' + iconConfig.icon + ' dialog-icon-symbol'"></i>
        </div>
      </div>

      <!-- Título y contenido -->
      <div class="dialog-content">
        <h3 class="dialog-title">{{ config.title }}</h3>
        <div class="dialog-message">
          <p>{{ config.message }}</p>
        </div>
      </div>

      <!-- Botón de cerrar (opcional) -->
      <button 
        *ngIf="config.allowEscapeKey"
        (click)="onCancel()"
        class="dialog-close-btn">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <!-- Cuerpo del diálogo (para contenido adicional) -->
    <div class="dialog-body" *ngIf="hasBodyContent">
      <ng-content></ng-content>
    </div>

    <!-- Footer con botones -->
    <div class="dialog-footer">
      
      <!-- Botón de cancelar -->
      <button 
        [class]="cancelButtonClasses"
        [@buttonPress]="cancelButtonState"
        (click)="onCancel()"
        type="button">
        <i class="pi pi-times mr-2"></i>
        {{ config.cancelText }}
      </button>

      <!-- Botón de confirmar -->
      <button 
        [class]="confirmButtonClasses"
        [@buttonPress]="confirmButtonState"
        (click)="onConfirm()"
        type="button">
        <i class="pi pi-check mr-2"></i>
        {{ config.confirmText }}
      </button>
    </div>

    <!-- Efectos visuales según el tipo -->
    <div class="dialog-effects">
      
      <!-- Efecto de advertencia -->
      <div *ngIf="config.type === 'warning'" class="warning-pulse"></div>
      
      <!-- Efecto de peligro -->
      <div *ngIf="config.type === 'danger'" class="danger-glow"></div>
      
      <!-- Efecto de éxito -->
      <div *ngIf="config.type === 'success'" class="success-sparkle">
        <div class="sparkle" *ngFor="let sparkle of [1,2,3]; let i = index" [style.animation-delay]="i * 0.3 + 's'">✨</div>
      </div>
    </div>
  </div>
</div>

<!-- Ejemplos de uso del componente -->

<!-- Estilos CSS -->
<style>
.dialog-overlay {
  @apply fixed inset-0 z-50 flex items-center justify-center p-4;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
}

.confirm-dialog {
  @apply bg-white rounded-2xl shadow-2xl border border-gray-200 max-w-md w-full relative overflow-hidden;
  max-height: 90vh;
  min-width: 320px;
}

.dialog-header {
  @apply p-6 border-b border-gray-200 flex items-start space-x-4 relative;
}

.dialog-icon-container {
  @apply flex-shrink-0;
}

.dialog-icon {
  @apply w-12 h-12 rounded-full flex items-center justify-center;
}

.dialog-icon-symbol {
  @apply text-xl;
}

.dialog-content {
  @apply flex-1 min-w-0;
}

.dialog-title {
  @apply text-xl font-bold text-gray-900 mb-2;
}

.dialog-message {
  @apply text-gray-600 leading-relaxed;
}

.dialog-close-btn {
  @apply absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors;
}

.dialog-body {
  @apply p-6 border-b border-gray-200;
}

.dialog-footer {
  @apply p-6 flex justify-end space-x-3 bg-gray-50;
}

.confirm-btn,
.cancel-btn {
  @apply flex items-center;
}

.dialog-effects {
  @apply absolute inset-0 pointer-events-none;
}

/* Efectos específicos por tipo */

/* Tipo Warning */
.type-warning .dialog-header {
  @apply border-yellow-200;
}

.warning-pulse {
  @apply absolute top-0 left-0 right-0 h-1 bg-yellow-400;
  animation: warningPulse 2s ease-in-out infinite;
}

/* Tipo Danger */
.type-danger .dialog-header {
  @apply border-red-200;
}

.danger-glow {
  @apply absolute inset-0 border-2 border-red-200 rounded-2xl;
  animation: dangerGlow 1.5s ease-in-out infinite;
}

/* Tipo Success */
.type-success .dialog-header {
  @apply border-green-200;
}

.success-sparkle {
  @apply absolute inset-0;
}

.sparkle {
  @apply absolute text-lg;
  animation: sparkleFloat 3s ease-in-out infinite;
}

.sparkle:nth-child(1) {
  top: 20%;
  left: 20%;
}

.sparkle:nth-child(2) {
  top: 30%;
  right: 25%;
}

.sparkle:nth-child(3) {
  bottom: 25%;
  left: 30%;
}

/* Tipo Info */
.type-info .dialog-header {
  @apply border-blue-200;
}

/* Animaciones */
@keyframes warningPulse {
  0%, 100% {
    opacity: 0.7;
    background-color: #fbbf24;
  }
  50% {
    opacity: 1;
    background-color: #f59e0b;
  }
}

@keyframes dangerGlow {
  0%, 100% {
    border-color: rgba(239, 68, 68, 0.3);
    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.1);
  }
  50% {
    border-color: rgba(239, 68, 68, 0.6);
    box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
  }
}

@keyframes sparkleFloat {
  0%, 100% {
    opacity: 0.3;
    transform: translateY(0) rotate(0deg) scale(0.8);
  }
  50% {
    opacity: 1;
    transform: translateY(-10px) rotate(180deg) scale(1);
  }
}

/* Hover effects */
.confirm-btn:hover {
  @apply transform scale-105 shadow-lg;
}

.cancel-btn:hover {
  @apply transform scale-105;
}

/* Focus states */
.confirm-btn:focus,
.cancel-btn:focus {
  @apply ring-2 ring-offset-2;
}

/* Estados pressed */
.confirm-btn:active,
.cancel-btn:active {
  @apply transform scale-95;
}

/* Responsive */
@media (max-width: 640px) {
  .confirm-dialog {
    @apply mx-4 max-w-sm;
  }
  
  .dialog-header {
    @apply p-4 flex-col space-x-0 space-y-3;
  }
  
  .dialog-footer {
    @apply p-4 flex-col space-x-0 space-y-2;
  }
  
  .confirm-btn,
  .cancel-btn {
    @apply w-full justify-center;
  }
}

/* Dark mode support */
@media (prefers-color-scheme: dark) {
  .confirm-dialog {
    @apply bg-gray-800 border-gray-700;
  }
  
  .dialog-title {
    @apply text-white;
  }
  
  .dialog-message {
    @apply text-gray-300;
  }
  
  .dialog-header {
    @apply border-gray-700;
  }
  
  .dialog-footer {
    @apply bg-gray-900;
  }
  
  .dialog-close-btn {
    @apply text-gray-400 hover:text-gray-200 hover:bg-gray-700;
  }
}

/* High contrast mode */
@media (prefers-contrast: high) {
  .confirm-dialog {
    @apply border-2 border-black;
  }
  
  .confirm-btn,
  .cancel-btn {
    @apply border-2 border-black;
  }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .warning-pulse,
  .danger-glow,
  .sparkle {
    animation: none;
  }
  
  .confirm-btn:hover,
  .cancel-btn:hover {
    @apply transform-none;
  }
}

/* Print styles */
@media print {
  .dialog-overlay {
    @apply hidden;
  }
}

/* Custom scrollbar for long content */
.dialog-body::-webkit-scrollbar {
  width: 6px;
}

.dialog-body::-webkit-scrollbar-track {
  @apply bg-gray-100 rounded;
}

.dialog-body::-webkit-scrollbar-thumb {
  @apply bg-gray-400 rounded;
}

.dialog-body::-webkit-scrollbar-thumb:hover {
  @apply bg-gray-500;
}

/* Loading state for buttons */
.confirm-btn.loading,
.cancel-btn.loading {
  @apply opacity-75 pointer-events-none;
}

.confirm-btn.loading::after,
.cancel-btn.loading::after {
  content: '';
  @apply inline-block w-4 h-4 ml-2 border-2 border-current border-t-transparent rounded-full;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
</style>
