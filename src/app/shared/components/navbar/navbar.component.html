<!-- src/app/shared/components/navbar/navbar.component.html -->
<!-- Debug: Navbar should always be visible -->
<nav class="bg-white shadow-lg border-b-2 border-emerald-500 sticky top-0 z-50">
  <!-- DEBUG: This should always show -->
  <div class="bg-red-500 text-white p-2 text-center">
    🔧 DEBUG: Navbar está funcionando! Estado actual: {{ currentUser ? 'Autenticado' : 'No autenticado' }}
  </div>
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">

      <!-- Logo y Título (Izquierda) -->
      <div class="flex items-center space-x-3 cursor-pointer" (click)="navigateToHome()">
        <div class="w-10 h-10 bg-gradient-to-r from-emerald-500 to-blue-500 rounded-lg flex items-center justify-center shadow-md">
          <i class="pi pi-globe text-white text-xl"></i>
        </div>
        <div class="hidden sm:block">
          <h1 class="text-xl font-bold text-gray-800">EcoBarómetro</h1>
          <p class="text-xs text-emerald-600" *ngIf="currentUser">{{ userTypeLabel }}</p>
        </div>
      </div>

      <!-- Usuario y Menú (Derecha) -->
      <div class="flex items-center space-x-4" *ngIf="currentUser">

        <!-- Info del Usuario (Desktop) -->
        <div class="hidden md:flex items-center space-x-3">
          <div class="text-right">
            <p class="text-sm font-medium text-gray-800">{{ displayName }}</p>
            <p class="text-xs text-gray-500" *ngIf="userStats">{{ userStats }}</p>
          </div>
          <div class="w-9 h-9 bg-gradient-to-r from-emerald-400 to-blue-400 rounded-full flex items-center justify-center">
            <span class="text-white font-bold text-sm">{{ userInitials }}</span>
          </div>
        </div>

        <!-- Menú Hamburguesa -->
        <div class="relative" #hamburgerMenu>
          <button
            (click)="toggleMenu()"
            class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            [class.bg-emerald-100]="isMenuOpen">
            <div class="w-6 h-6 flex flex-col justify-center items-center space-y-1">
              <span class="block w-5 h-0.5 bg-gray-600 transition-all duration-300"
                    [class.rotate-45]="isMenuOpen"
                    [class.translate-y-1.5]="isMenuOpen"></span>
              <span class="block w-5 h-0.5 bg-gray-600 transition-all duration-300"
                    [class.opacity-0]="isMenuOpen"></span>
              <span class="block w-5 h-0.5 bg-gray-600 transition-all duration-300"
                    [class.-rotate-45]="isMenuOpen"
                    [class.-translate-y-1.5]="isMenuOpen"></span>
            </div>
          </button>

          <!-- Dropdown Menu -->
          <div *ngIf="isMenuOpen"
               class="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-xl border border-gray-200 py-2 animate__animated animate__fadeInDown animate__faster">

            <!-- User Info Header (Mobile) -->
            <div class="px-4 py-3 border-b border-gray-100 md:hidden">
              <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-gradient-to-r from-emerald-400 to-blue-400 rounded-full flex items-center justify-center">
                  <span class="text-white font-bold">{{ userInitials }}</span>
                </div>
                <div>
                  <p class="font-medium text-gray-800">{{ displayName }}</p>
                  <p class="text-sm text-gray-500">{{ userTypeLabel }}</p>
                  <p class="text-xs text-emerald-600" *ngIf="userStats">{{ userStats }}</p>
                </div>
              </div>
            </div>

            <!-- Quick Actions -->
            <div class="px-2 py-2">
              <p class="px-3 py-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">Acciones Rápidas</p>

              <!-- Quick Play (Solo para usuarios) -->
              <button *ngIf="currentUser?.role === 'user'"
                      (click)="quickPlay()"
                      class="w-full flex items-center px-3 py-2 text-sm text-gray-700 hover:bg-emerald-50 hover:text-emerald-700 rounded-lg transition-colors duration-200">
                <i class="pi pi-play text-emerald-500 mr-3"></i>
                <span class="font-medium">🎮 Jugar Ahora</span>
              </button>

              <!-- View Profile -->
              <button (click)="viewProfile()"
                      class="w-full flex items-center px-3 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 rounded-lg transition-colors duration-200">
                <i class="pi pi-user text-blue-500 mr-3"></i>
                <span>Ver Perfil</span>
              </button>
            </div>

            <!-- Navigation Menu -->
            <div class="px-2 py-2 border-t border-gray-100">
              <p class="px-3 py-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">Navegación</p>

              <button *ngFor="let item of availableMenuItems"
                      (click)="navigateTo(item.route)"
                      class="w-full flex items-center px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors duration-200">
                <i [class]="item.icon + ' text-gray-500 mr-3'"></i>
                <span>{{ item.label }}</span>
              </button>
            </div>

            <!-- Logout Section -->
            <div class="px-2 py-2 border-t border-gray-100">
              <button (click)="logout()"
                      class="w-full flex items-center px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition-colors duration-200">
                <i class="pi pi-sign-out text-red-500 mr-3"></i>
                <span class="font-medium">Cerrar Sesión</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Login/Register buttons if not authenticated -->
      <div class="flex items-center space-x-3" *ngIf="!currentUser">
        <button (click)="navigateTo('/auth/login')"
                class="px-4 py-2 text-emerald-600 hover:text-emerald-700 font-medium transition-colors duration-200">
          Iniciar Sesión
        </button>
        <button (click)="navigateTo('/auth/register')"
                class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg font-medium transition-colors duration-200">
          Registrarse
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- Overlay para cerrar el menú en mobile -->
<div *ngIf="isMenuOpen"
     class="fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden"
     (click)="closeMenu()">
</div>
