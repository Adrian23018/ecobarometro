<!-- NAVBAR -->
<nav class="navbar-bar">
  <div class="navbar-inner">

    <!-- Hamburguesa (izquierda) -->
    <button *ngIf="currentUser" class="hamburger-btn" (click)="toggleMenu()" [class.active]="isMenuOpen">
      <span class="bar" [class.open]="isMenuOpen"></span>
      <span class="bar" [class.open]="isMenuOpen"></span>
      <span class="bar" [class.open]="isMenuOpen"></span>
    </button>

    <!-- Logo (centro-izquierda) -->
    <div class="navbar-logo" (click)="navigateToHome()">
      <div class="logo-icon">🌍</div>
      <div class="logo-text">
        <span class="logo-title">EcoBarómetro</span>
        <span class="logo-role" *ngIf="currentUser">{{ userTypeLabel }}</span>
      </div>
    </div>

    <!-- Info usuario (derecha) -->
    <div class="navbar-user" *ngIf="currentUser">
      <div class="user-info hidden-mobile">
        <span class="user-name">{{ displayName }}</span>
        <span class="user-stats" *ngIf="userStats">{{ userStats }}</span>
      </div>
      <div class="user-avatar">{{ userInitials }}</div>
    </div>

    <!-- Botones si no autenticado -->
    <div class="navbar-auth" *ngIf="!currentUser">
      <button class="btn-login" (click)="navigateTo('/auth/login')">Iniciar Sesión</button>
      <button class="btn-register" (click)="navigateTo('/auth/register')">Registrarse</button>
    </div>

  </div>
</nav>

<!-- OVERLAY -->
<div class="drawer-overlay" *ngIf="isMenuOpen" (click)="closeMenu()"></div>

<!-- DRAWER LATERAL IZQUIERDO -->
<div class="drawer" [class.drawer-open]="isMenuOpen">

  <!-- Header del drawer -->
  <div class="drawer-header">
    <div class="drawer-avatar">{{ userInitials }}</div>
    <div class="drawer-user-info">
      <span class="drawer-name">{{ displayName }}</span>
      <span class="drawer-role">{{ userTypeLabel }}</span>
      <span class="drawer-stats" *ngIf="userStats">{{ userStats }}</span>
    </div>
  </div>

  <!-- Navegación -->
  <nav class="drawer-nav">
    <button
      *ngFor="let item of availableMenuItems"
      class="drawer-item"
      [class.loading]="startingGame && item.action === 'startGame'"
      (click)="navigateTo(item.route, item.action)">
      <i [class]="item.icon + ' drawer-item-icon'"></i>
      <span>{{ startingGame && item.action === 'startGame' ? 'Iniciando...' : item.label }}</span>
    </button>
  </nav>

  <!-- Cerrar sesión (abajo) -->
  <div class="drawer-footer">
    <button class="drawer-logout" (click)="logout()">
      <i class="pi pi-sign-out drawer-item-icon"></i>
      <span>Cerrar Sesión</span>
    </button>
  </div>

</div>
