<!-- Header Universal con Botón Atrás y Logout -->
<header class="bg-white shadow-md border-b-4 border-emerald-500 relative">
  <div class="container mx-auto px-4 py-3">
    <div class="flex justify-between items-center">

      <!-- Lado Izquierdo - Botón Atrás -->
      <button
        class="back-button flex items-center gap-2 p-2 rounded-xl text-gray-700 hover:bg-gray-100 font-medium transition-all duration-300"
        (click)="goBack()"
        pRipple>
        <i class="pi pi-arrow-left text-lg"></i>
        <span class="hidden sm:inline">Atrás</span>
      </button>

      <!-- Centro - Logo y Título -->
      <div class="flex items-center space-x-3 cursor-pointer" (click)="navigateToDashboard()">
        <div class="w-10 h-10 bg-gradient-to-r from-green-500 to-blue-500 rounded-lg flex items-center justify-center shadow-md">
          <i class="pi pi-globe text-white text-xl"></i>
        </div>
        <div class="hidden sm:block">
          <h1 class="text-xl font-bold text-gray-800">EcoBarómetro</h1>
          <p class="text-xs text-gray-500" *ngIf="user?.role === 'admin'">Panel Admin</p>
          <p class="text-xs text-emerald-600" *ngIf="user?.role === 'user'">Nivel {{ user?.level || 1 }}</p>
        </div>
      </div>

      <!-- Lado Derecho - Usuario y Logout -->
      <div class="flex items-center gap-3">

        <!-- Info del Usuario -->
        <div *ngIf="user" class="hidden sm:flex items-center gap-3">
          <div class="text-right">
            <p class="text-sm font-medium text-gray-800">{{ user.name || user.username }}</p>
            <p class="text-xs text-gray-500">{{ user.points || 0 }} puntos</p>
          </div>
          <div class="w-10 h-10 bg-gradient-to-r from-emerald-400 to-blue-400 rounded-full flex items-center justify-center">
            <span class="text-white font-bold text-sm">{{ getAvatarInitials(user.name || user.username) }}</span>
          </div>
        </div>

        <!-- Botón Logout -->
        <button
          class="logout-button flex items-center gap-2 px-3 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium transition-all duration-300 shadow-md hover:shadow-lg"
          (click)="logout()"
          pRipple>
          <i class="pi pi-sign-out text-sm"></i>
          <span class="hidden sm:inline">Salir</span>
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Notificaciones Toast para Feedback -->
<p-toast></p-toast>
