<!-- src/app/features/auth/login/login.component.html -->
<div class="auth-page">
  <div class="auth-wrapper">

    <!-- Brand header -->
    <div class="auth-brand">
      <div class="auth-logo"><i class="pi pi-globe"></i></div>
      <h1 class="auth-name">EcoBarómetro</h1>
      <p class="auth-tagline">Aprende jugando sobre el medio ambiente</p>
    </div>

    <!-- Card -->
    <div class="auth-card">

      <!-- Tab toggle -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab" [class.auth-tab--active]="activeTab === 0"
          (click)="activeTab = 0">
          <i class="pi pi-user"></i> Jugador
        </button>
        <button type="button" class="auth-tab" [class.auth-tab--active]="activeTab === 1"
          (click)="activeTab = 1">
          <i class="pi pi-cog"></i> Admin
        </button>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

        <!-- Email -->
        <div class="auth-field">
          <label class="auth-label">Correo electrónico</label>
          <input
            type="email"
            formControlName="email"
            placeholder="tu@email.com"
            class="auth-input"
            [class.auth-input--error]="isFieldInvalid('email')">
          <span *ngIf="isFieldInvalid('email')" class="auth-error">{{ getFieldError('email') }}</span>
        </div>

        <!-- Password -->
        <div class="auth-field">
          <label class="auth-label">Contraseña</label>
          <div class="auth-pw-wrap">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              class="auth-input auth-input--pw"
              [class.auth-input--error]="isFieldInvalid('password')">
            <button type="button" class="auth-pw-btn" (click)="showPassword = !showPassword">
              <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
            </button>
          </div>
          <span *ngIf="isFieldInvalid('password')" class="auth-error">{{ getFieldError('password') }}</span>
        </div>

        <!-- Remember & Forgot -->
        <div class="auth-row">
          <label class="auth-check-label">
            <input type="checkbox" formControlName="rememberMe" class="auth-check">
            <span>Recordarme</span>
          </label>
          <a href="#" class="auth-link-sm">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="auth-btn-primary"
          [disabled]="!loginForm.valid || isLoading">
          <span *ngIf="!isLoading">
            <i [class]="activeTab === 0 ? 'pi pi-play' : 'pi pi-cog'"></i>
            {{ activeTab === 0 ? 'Empezar a Jugar' : 'Acceder al Panel' }}
          </span>
          <span *ngIf="isLoading" class="auth-loading">
            <span class="auth-spinner"></span> Iniciando sesión...
          </span>
        </button>

        <!-- Divider -->
        <div class="auth-divider"><span>¿Primera vez aquí?</span></div>

        <!-- Register link -->
        <button type="button" class="auth-btn-outline" (click)="navigateToRegister()">
          Crear Nueva Cuenta
        </button>

      </form>
    </div>

    <!-- Footer info -->
    <div class="auth-footer">
      <span><i class="pi pi-leaf"></i> Sostenibilidad</span>
      <span class="auth-footer-dot">·</span>
      <span><i class="pi pi-trophy"></i> Ranking</span>
      <span class="auth-footer-dot">·</span>
      <span><i class="pi pi-book"></i> Aprendizaje</span>
    </div>

  </div>
</div>
